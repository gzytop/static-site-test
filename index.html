<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人主页 - 由 GitHub Pages 部署的静态网站" />
    <title>gzytop · 个人主页</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E" />
</head>
<body>
    <main class="profile-card">
        <div class="avatar-wrapper">
            <img
                class="avatar"
                src="https://github.com/gzytop.png"
                alt="gzytop 的头像"
                onerror="this.onerror=null;this.src='https://api.dicebear.com/7.x/initials/svg?seed=gzytop&backgroundColor=4f46e5';"
            />
        </div>

        <h1 class="name">gzytop</h1>
        <p class="tagline">全栈开发爱好者 · 折腾各种有趣的东西</p>

        <p class="bio">
            这是我用来测试 GitHub Pages 的第一个静态站点。
            页面完全由 HTML + CSS 手写，没有任何构建工具，
            提交后由 GitHub Pages 自动部署。
        </p>

        <nav class="social-links" aria-label="社交链接">
            <a class="social-link" href="https://github.com/gzytop" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.93c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.05.78 2.12v3.15c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
                </svg>
                <span>GitHub</span>
            </a>

            <a class="social-link" href="mailto:hello@example.com">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor" d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6zm2 .4V18h16V6.4l-8 5.6L4 6.4zM19.2 6H4.8L12 11l7.2-5z"/>
                </svg>
                <span>Email</span>
            </a>

            <a class="social-link" href="https://github.com/gzytop/static-site-test" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <path fill="currentColor" d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0L19.2 12l-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
                </svg>
                <span>本项目源码</span>
            </a>
        </nav>

        <footer class="footer">
            <span id="deploy-time">加载中…</span>
            <span class="separator">·</span>
            <span>Powered by GitHub Pages</span>
        </footer>
    </main>

    <script>
        const deployTimeElement = document.getElementById('deploy-time');
        const currentTime = new Date().toLocaleString('zh-CN', {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit'
        });
        deployTimeElement.textContent = `页面访问时间：${currentTime}`;
    </script>
</body>
</html>

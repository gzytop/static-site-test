<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gzy 的静态学习网站</title>

    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2314161A'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' fill='%23F1F2F4' text-anchor='middle'%3Eg%3C/text%3E%3C/svg%3E" />

<body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <div class="page">
        <header class="masthead">
            <h1 class="title">gzy 的静态学习网站</h1>
            <p class="tagline">测试用的网站</p>
        </header>

        <main class="main" id="main">
            <section class="section">
                <h2 class="section__label">关于</h2>
                <p class="lede">好好学习，天天向上。</p>
                <p class="prose">
                    这个站点是我用来练手的静态页面：一个 HTML 文件、一份样式表，没有框架，
                    也没有构建步骤。改动推送到 <code>main</code> 之后，GitHub Pages
                    会直接把它发布出去。
                </p>
            </section>

            <section class="section">
                <h2 class="section__label">联系</h2>
                <ul class="links">
                    <li>
                        <a class="link" href="https://github.com/gzytop" target="_blank" rel="noopener noreferrer">
                            <span class="link__name">GitHub</span>
                            <span class="link__meta">@gzytop</span>
                        </a>
                    </li>
                    <li>
                        <a class="link" href="mailto:2609862939@qq.com">
                            <span class="link__name">邮箱</span>
                            <span class="link__meta">2609862939@qq.com</span>
                        </a>
                    </li>
                    <li>
                        <a class="link" href="https://github.com/gzytop/static-site-test" target="_blank" rel="noopener noreferrer">

    <script>
        (function () {
            var stamp = document.getElementById('stamp');
            if (!stamp) return;
            var now = new Date();
            var text = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            stamp.textContent = '本页加载于 ' + text;
        })();
    </script>
